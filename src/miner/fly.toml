# Fly.io config for the Throughline miner.
#
# Production config for process-discovery-miner (created from fly.toml.example).
#   fly launch --no-deploy --copy-config
#   fly secrets set SUPABASE_JWT_SECRET=...   # only if your project still issues HS256 tokens
#   fly deploy
#
# Run these from src/miner so the Docker build context is this folder.

app = "process-discovery-miner"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Refuses AUTH_DISABLED, ALLOW_HTTP_URLS and an empty host allowlist at startup.
  ENVIRONMENT = "production"
  # JWKS verification (RS256/ES256) and issuer pinning. Public, so it lives here.
  SUPABASE_URL = "https://aoiqjainatmkepmnmeho.supabase.co"
  # Only fetch and write signed URLs on your Supabase Storage host (required in production).
  EVENTS_URL_ALLOWED_HOSTS = "aoiqjainatmkepmnmeho.supabase.co"
  MAX_EVENTS = "250000"
  MAX_PAYLOAD_BYTES = "52428800"       # 50 MiB: the one upload limit (docs/deployment-plan.md)
  MAX_XES_UNCOMPRESSED_BYTES = "536870912"  # 512 MiB
  # pm4py is AGPL-3.0: point users of the network service at its source.
  SOURCE_URL = "https://github.com/sageedwards-del/process-discovery-engine"
  WEB_CONCURRENCY = "1"                # one uvicorn worker per vCPU

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # Mining is CPU-bound; queue at the proxy rather than oversubscribing the CPU.
    # Each request can hold a 50 MB file plus pm4py's working set, so keep it to two.
    soft_limit = 1
    hard_limit = 2

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
