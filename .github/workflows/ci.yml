name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w @throughline/web

  miner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/miner
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is only allowed at step level, so each step checks for the worker.
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('src/miner/pyproject.toml') != ''
      - run: uv sync --frozen
        if: hashFiles('src/miner/pyproject.toml') != ''
      - run: uv run ruff check .
        if: hashFiles('src/miner/pyproject.toml') != ''
      - run: uv run pytest -q
        if: hashFiles('src/miner/pyproject.toml') != ''
